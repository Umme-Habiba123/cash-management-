
{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">

    <div class="card shadow-sm">
        <div class="card-header">
            <h3>My Profile</h3>
        </div>

        <div class="card-body">
            <p>
                <strong>Username:</strong>
                {{ request.user.username }}
            </p>

            <p>
                <strong>Email:</strong>
                {{ request.user.email }}
            </p>

            <a href="{% url 'dashboard' %}" class="btn btn-primary">
                Back to Dashboard
            </a>
        </div>
    </div>

</div>
{% endblock %}
